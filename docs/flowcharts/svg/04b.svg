466171" stroke-width="1.1" rx="0"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:rect><ns0:text x="796.5" y="200.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="796.5" dy="0">solutions, condition_number = [], None</ns0:tspan></ns0:text><ns0:polygon points="796.5,247.0 886.5,271.0 796.5,295.0 706.5,271.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:polygon><ns0:text x="796.5" y="274.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="796.5" dy="0">case == 2?</ns0:tspan></ns0:text><ns0:rect x="572.7919921875" y="324.0" width="269.416015625" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:rect><ns0:text x="707.5" y="345.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="707.5" dy="0">_, _, ae, an, be, bn, determinant =</ns0:tspan><ns0:tspan x="707.5" dy="14">_length_system(sides)</ns0:tspan><ns0:tspan x="707.5" dy="14">condition_number = (1 + abs(ae * be + an *</ns0:tspan><ns0:tspan x="707.5" dy="14">bn)) / abs(determinant)</ns0:tspan></ns0:text><ns0:polygon points="796.5,431.0 975.302734375,455.0 796.5,479.0 617.697265625,455.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:polygon><ns0:text x="796.5" y="458.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="796.5" dy="0">More candidate in candidates?</ns0:tspan></ns0:text><ns0:polygon points="796.5,508.0 999.52099609375,546.0 796.5,584.0 593.47900390625,546.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:polygon><ns0:text x="796.5" y="542.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="796.5" dy="0">any(s.length &lt;= policy.length for s</ns0:tspan><ns0:tspan x="796.5" dy="14">in candidate)?</ns0:tspan></ns0:text><ns0:rect x="703.95654296875" y="617.0" width="243.0869140625" height="64" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:rect><ns0:line x1="711.95654296875" y1="617.0" x2="711.95654296875" y2="681.0" stroke="#33548b" /><ns0:line x1="939.04345703125" y1="617.0" x2="939.04345703125" y2="681.0" stroke="#33548b" /><ns0:text x="825.5" y="638.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="825.5" dy="0">solution = evaluate_solution(candidate,</ns0:tspan><ns0:tspan x="825.5" dy="14">initial_e, initial_n)</ns0:tspan><ns0:tspan x="825.5" dy="14">See 08a–08b</ns0:tspan></ns0:text><ns0:rect x="699.41650390625" y="714.0" width="260.1669921875" height="106" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:rect><ns0:text x="829.5" y="735.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="829.5" dy="0">duplicate = any(all(math.hypot(a[0] - b[0],</ns0:tspan><ns0:tspan x="829.5" dy="14">a[1] - b[1])</ns0:tspan><ns0:tspan x="829.5" dy="14">    &lt;= solution.tolerance</ns0:tspan><ns0:tspan x="829.5" dy="14">    for a, b in zip(solution.components,</ns0:tspan><ns0:tspan x="829.5" dy="14">old.components))</ns0:tspan><ns0:tspan x="829.5" dy="14">    for old in solutions)</ns0:tspan></ns0:text><ns0:polygon points="837.5,849.0 956.31298828125,901.0 837.5,953.0 718.68701171875,901.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:polygon><ns0:text x="837.5" y="890.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="837.5" dy="0">solution.closure &lt;=</ns0:tspan><ns0:tspan x="837.5" dy="14">solution.tolerance</ns0:tspan><ns0:tspan x="837.5" dy="14">and not duplicate?</ns0:tspan></ns0:text><ns0:polygon points="837.5,982.0 1041.7724609375,1020.0 837.5,1058.0 633.2275390625,1020.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:polygon><ns0:text x="837.5" y="1016.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="837.5" dy="0">case == 2 and abs(determinant) &lt;</ns0:tspan><ns0:tspan x="837.5" dy="14">policy.conditioning_warning?</ns0:tspan></ns0:text><ns0:rect x="804.880859375" y="1087.0" width="253.23828125" height="64" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:rect><ns0:text x="931.5" y="1108.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="931.5" dy="0">solution.warnings.append("Ill-conditioned</ns0:tspan><ns0:tspan x="931.5" dy="14">bearings: ..."</ns0:tspan><ns0:tspan x="931.5" dy="14">    + condition_number text)</ns0:tspan></ns0:text><ns0:rect x="846.321533203125" y="1180.0" width="170.35693359375" height="42" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:rect><ns0:text x="931.5" y="1204.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="931.5" dy="0">solutions.append(solution)</ns0:tspan></ns0:text><ns0:polygon points="474.5,522.0 564.5,546.0 474.5,570.0 384.5,546.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:polygon><ns0:text x="474.5" y="549.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="474.5" dy="0">not solutions?</ns0:tspan></ns0:text><ns0:ellipse cx="478.5" cy="649.0" rx="165.641923828125" ry="35.84" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:ellipse><ns0:text x="478.5" y="638.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="478.5" dy="0">raise TraverseError</ns0:tspan><ns0:tspan x="478.5" dy="14">Check reversed bearing (180°), quadrant, side</ns0:tspan><ns0:tspan x="478.5" dy="14">order, entered lengths</ns0:tspan></ns0:text><ns0:rect x="60.890380859375" y="624.0" width="223.21923828125" height="50" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></ns0:rect><ns0:text x="172.5" y="645.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="172.5" dy="0">solutions.sort(key=lambda solution:</ns0:tspan><ns0:tspan x="172.5" dy="14">solution.area is None)</ns0:tspan></ns0:text><ns0:rect x="39.400634765625" y="735.0" width="266.19873046875" height="64" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>explain_result — traverse_solver.py:324–369</ns0:title></ns0:rect><ns0:line x1="47.400634765625" y1="735.0" x2="47.400634765625" y2="799.0" stroke="#33548b" /><ns0:line x1="297.599365234375" y1="735.0" x2="297.599365234375" y2="799.0" stroke="#33548b" /><ns0:text x="172.5" y="756.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="172.5" dy="0">explain_result(sides, case, target, solutions,</ns0:tspan><ns0:tspan x="172.5" dy="14">condition_number)</ns0:tspan><ns0:tspan x="172.5" dy="14">See 11d</ns0:tspan></ns0:text><ns0:ellipse cx="172.5" cy="901.0" rx="136.46861328125" ry="51.52" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_traverse — traverse_solver.py:372–412</ns0:title></n