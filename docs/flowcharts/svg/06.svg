oke="#465b68" stroke-width="1.2" /><ns0:polygon points="639.0,1244.839 642.0,1237.839 636.0,1237.839" fill="#465b68" /><ns0:polyline points="735.0,1244.74 735.0,1205.13 735.0,1124.0 570.5,1124.0 570.5,937.19 570.5,930.19" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="570.5,930.19 567.5,937.19 573.5,937.19" fill="#465b68" /><ns0:ellipse cx="369.0" cy="123.5" rx="125.11111328125" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:ellipse><ns0:text x="369.0" y="127.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="369.0" dy="0">solve_case_ii(sides, target, policy)</ns0:tspan></ns0:text><ns0:rect x="250.04541015625" y="176.0" width="237.9091796875" height="92" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:rect><ns0:text x="369.0" y="197.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="369.0" dy="0">i = next(i for i, s in enumerate(sides) if</ns0:tspan><ns0:tspan x="369.0" dy="14">s.length is None)</ns0:tspan><ns0:tspan x="369.0" dy="14">j = next(i for i, s in enumerate(sides) if</ns0:tspan><ns0:tspan x="369.0" dy="14">s.azimuth is None)</ns0:tspan><ns0:tspan x="369.0" dy="14">east, north = target</ns0:tspan></ns0:text><ns0:rect x="252.44091796875" y="297.0" width="233.1181640625" height="42" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>unit_vector — traverse_solver.py:174–175</ns0:title></ns0:rect><ns0:line x1="260.44091796875" y1="297.0" x2="260.44091796875" y2="339.0" stroke="#33548b" /><ns0:line x1="477.55908203125" y1="297.0" x2="477.55908203125" y2="339.0" stroke="#33548b" /><ns0:text x="369.0" y="321.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="369.0" dy="0">ue, un = unit_vector(sides[i].azimuth)</ns0:tspan></ns0:text><ns0:rect x="252.363037109375" y="368.0" width="233.27392578125" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:rect><ns0:text x="369.0" y="389.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="369.0" dy="0">projection = east * ue + north * un</ns0:tspan><ns0:tspan x="369.0" dy="14">perpendicular = east * un - north * ue</ns0:tspan><ns0:tspan x="369.0" dy="14">discriminant = sides[j].length**2 -</ns0:tspan><ns0:tspan x="369.0" dy="14">perpendicular**2</ns0:tspan></ns0:text><ns0:polygon points="369.0,475.0 509.947265625,513.0 369.0,551.0 228.052734375,513.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:polygon><ns0:text x="369.0" y="509.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="369.0" dy="0">discriminant &lt;</ns0:tspan><ns0:tspan x="369.0" dy="14">-policy.squared_length?</ns0:tspan></ns0:text><ns0:ellipse cx="199.0" cy="618.0" rx="162.88494140625" ry="28.000000000000004" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:ellipse><ns0:text x="199.0" y="614.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="199.0" dy="0">raise TraverseError("No solution: the known</ns0:tspan><ns0:tspan x="199.0" dy="14">length cannot reach the known-bearing ray.")</ns0:tspan></ns0:text><ns0:polygon points="540.0,580.0 688.56884765625,618.0 540.0,656.0 391.43115234375,618.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:polygon><ns0:text x="540.0" y="614.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="540.0" dy="0">abs(discriminant) &lt;=</ns0:tspan><ns0:tspan x="540.0" dy="14">policy.roundoff_squared?</ns0:tspan></ns0:text><ns0:rect x="401.5" y="685.0" width="155" height="42" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:rect><ns0:text x="479.0" y="709.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="479.0" dy="0">discriminant = 0.0</ns0:tspan></ns0:text><ns0:rect x="420.210205078125" y="756.0" width="239.57958984375" height="50" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:rect><ns0:text x="540.0" y="777.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="540.0" dy="0">root = math.sqrt(max(0, discriminant))</ns0:tspan><ns0:tspan x="540.0" dy="14">candidates = []</ns0:tspan></ns0:text><ns0:polygon points="540.0,835.0 717.6103515625,887.0 540.0,939.0 362.3896484375,887.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:polygon><ns0:text x="540.0" y="876.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="540.0" dy="0">More length values in</ns0:tspan><ns0:tspan x="540.0" dy="14">(projection + root, projection -</ns0:tspan><ns0:tspan x="540.0" dy="14">root)?</ns0:tspan></ns0:text><ns0:polygon points="406.0,968.0 553.26904296875,992.0 406.0,1016.0 258.73095703125,992.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:polygon><ns0:text x="406.0" y="995.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="406.0" dy="0">length &lt;= policy.length?</ns0:tspan></ns0:text><ns0:rect x="363.484130859375" y="1045.0" width="195.03173828125" height="64" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:rect><ns0:text x="461.0" y="1066.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="461.0" dy="0">candidate = list(sides)</ns0:tspan><ns0:tspan x="461.0" dy="14">candidate[i] = replace(sides[i],</ns0:tspan><ns0:tspan x="461.0" dy="14">length=length)</ns0:tspan></ns0:text><ns0:rect x="430.86181640625" y="1138.0" width="280.2763671875" height="78" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>vector_azimuth — traverse_solver.py:183–185</ns0:title></ns0:rect><ns0:line x1="438.86181640625" y1="1138.0" x2="438.86181640625" y2="1216.0" stroke="#33548b" /><ns0:line x1="703.13818359375" y1="1138.0" x2="703.13818359375" y2="1216.0" stroke="#33548b" /><ns0:text x="571.0" y="1159.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="571.0" dy="0">candidate[j] = replace(sides[j],</ns0:tspan><ns0:tspan x="571.0" dy="14">    azimuth=vector_azimuth(east - length * ue,</ns0:tspan><ns0:tspan x="571.0" dy="14">                           north - length *</ns0:tspan><ns0:tspan x="571.0" dy="14">un))</ns0:tspan></ns0:text><ns0:rect x="566.778564453125" y="1245.0" width="192.44287109375" height="42" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:rect><ns0:text x="663.0" y="1269.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="663.0" dy="0">candidates.append(candidate)</ns0:tspan></ns0:text><ns0:ellipse cx="674.0" cy="992.0" rx="91.44999999999999" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_ii — traverse_solver.py:234–255</ns0:title></ns0:ellipse><ns0:text x="674.0" y="995.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="674.0" dy="0">return candidates</ns0:tspan></ns0:text><ns0:rect x="36" y="1322.0" width="729.5" height="72" fill="#f6f7f9" stroke="#75828c" stroke-width="1.1" rx="0"><ns0:title>NumericalPolicy — traverse_solver.py:109–127</ns0:title></ns0:rect><ns0:text x="48" y="1339.0" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="48" dy="0">NumericalPolicy.squared_length: return self.scale * self.length</ns0:tspan><ns0:tspan x="48" dy="13">NumericalPolicy.roundoff_squared:</ns0:tspan><ns0:tspan x="48" dy="13">return 64 * sys.float_info.epsilon * self.scale**2</ns0:tspan><ns0:tspan x="48" dy="13">An empty candidates list is returned if neither length is positive.</ns0:tspan></ns0:text><ns0:rect x="276.63818359375" y="557.72" width="21.7236328125" height="14" fill="white" /><ns0:text x="287.5" y="567.72" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="287.5" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="435.130615234375" y="550.57" width="18.23876953125" height="14" fill="white" /><ns0:text x="444.25" y="560.57" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="444.25" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="460.63818359375" y="657.29" width="21.7236328125" height="14" fill="white" /><ns0:text x="471.5" y="667.29" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="471.5" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="592.630615234375" y="681.82" width="18.23876953125" height="14" fill="white" /><ns0:text x="601.75" y="691.82" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="601.75" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="407.80818359375" y="933.0" width="21.7236328125" height="14" fill="white" /><ns0:text x="418.67" y="943.0" fill="#203849" font-size="9" font-