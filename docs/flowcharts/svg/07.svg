#465b68" /><ns0:polyline points="1206.5,996.23 1206.5,1038.95 1206.5,1045.95" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="1206.5,1045.95 1209.5,1038.95 1203.5,1038.95" fill="#465b68" /><ns0:polyline points="1346.5,1017.13 1346.5,1047.4 1346.5,1054.4" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="1346.5,1054.4 1349.5,1047.4 1343.5,1047.4" fill="#465b68" /><ns0:polyline points="1148.75,1110.1 1148.75,1131.68 1148.8,1138.68" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="1148.8,1138.68 1151.7499247477776,1131.6587505397936 1145.7500778031454,1131.701606589398" fill="#465b68" /><ns0:polyline points="1269.0,1231.03 1269.0,1252.66 1269.0,1259.657" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="1269.0,1259.657 1272.0,1252.657 1266.0,1252.657" fill="#465b68" /><ns0:polyline points="1390.52,1282.0 1432.35,1282.0 1472.0,1282.0 1472.0,1005.26 1472.0,998.26" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="1472.0,998.26 1469.0,1005.26 1475.0,1005.26" fill="#465b68" /><ns0:ellipse cx="714.5" cy="123.5" rx="127.14874511718749" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:ellipse><ns0:text x="714.5" y="127.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="714.5" dy="0">solve_case_iv(sides, target, policy)</ns0:tspan></ns0:text><ns0:rect x="602.8017578125" y="176.0" width="223.396484375" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:rect><ns0:text x="714.5" y="197.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="714.5" dy="0">i, j = [i for i, s in enumerate(sides) if</ns0:tspan><ns0:tspan x="714.5" dy="14">s.azimuth is None]</ns0:tspan><ns0:tspan x="714.5" dy="14">a, b, distance = sides[i].length,</ns0:tspan><ns0:tspan x="714.5" dy="14">sides[j].length, math.hypot(*target)</ns0:tspan></ns0:text><ns0:polygon points="714.5,283.0 873.31689453125,307.0 714.5,331.0 555.68310546875,307.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:polygon><ns0:text x="714.5" y="310.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="714.5" dy="0">distance &lt;= policy.length?</ns0:tspan></ns0:text><ns0:polygon points="522.5,388.0 687.42919921875,412.0 522.5,436.0 357.57080078125,412.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:polygon><ns0:text x="522.5" y="415.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="522.5" dy="0">abs(a - b) &lt;= policy.length?</ns0:tspan></ns0:text><ns0:ellipse cx="198.5" cy="536.5" rx="162.2669970703125" ry="43.68000000000001" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:ellipse><ns0:text x="198.5" y="519.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="198.5" dy="0">raise TraverseError("Infinitely many</ns0:tspan><ns0:tspan x="198.5" dy="14">solutions: equal opposite sides can rotate</ns0:tspan><ns0:tspan x="198.5" dy="14">freely; supply another bearing or engineering</ns0:tspan><ns0:tspan x="198.5" dy="14">constraint.")</ns0:tspan></ns0:text><ns0:ellipse cx="538.5" cy="536.5" rx="149.19509765625" ry="28.000000000000004" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:ellipse><ns0:text x="538.5" y="533.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="538.5" dy="0">raise TraverseError("No solution: unequal</ns0:tspan><ns0:tspan x="538.5" dy="14">lengths cannot sum to a zero vector.")</ns0:tspan></ns0:text><ns0:polygon points="906.5,360.0 1096.40478515625,412.0 906.5,464.0 716.59521484375,412.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:polygon><ns0:text x="906.5" y="401.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="906.5" dy="0">distance &gt; a + b + policy.length</ns0:tspan><ns0:tspan x="906.5" dy="14">or distance &lt; abs(a - b) -</ns0:tspan><ns0:tspan x="906.5" dy="14">policy.length?</ns0:tspan></ns0:text><ns0:ellipse cx="891.5" cy="536.5" rx="144.22619140625" ry="28.000000000000004" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:ellipse><ns0:text x="891.5" y="533.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="891.5" dy="0">raise TraverseError("No solution: known</ns0:tspan><ns0:tspan x="891.5" dy="14">lengths violate the triangle inequality.")</ns0:tspan></ns0:text><ns0:rect x="1064.619384765625" y="504.5" width="251.76123046875" height="64" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:rect><ns0:text x="1190.5" y="526.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1190.5" dy="0">along = (distance**2 + a**2 - b**2) / (2 *</ns0:tspan><ns0:tspan x="1190.5" dy="14">distance)</ns0:tspan><ns0:tspan x="1190.5" dy="14">height_sq = a**2 - along**2</ns0:tspan></ns0:text><ns0:polygon points="1190.5,609.0 1400.93310546875,633.0 1190.5,657.0 980.06689453125,633.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:polygon><ns0:text x="1190.5" y="636.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1190.5" dy="0">height_sq &lt; -policy.squared_length?</ns0:tspan></ns0:text><ns0:ellipse cx="1034.5" cy="724.0" rx="134.4563330078125" ry="28.000000000000004" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:ellipse><ns0:text x="1034.5" y="720.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1034.5" dy="0">raise TraverseError("No stable circle</ns0:tspan><ns0:tspan x="1034.5" dy="14">intersection exists for these inputs.")</ns0:tspan></ns0:text><ns0:polygon points="1346.5,686.0 1495.06884765625,724.0 1346.5,762.0 1197.93115234375,724.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:polygon><ns0:text x="1346.5" y="720.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1346.5" dy="0">abs(height_sq) &lt;=</ns0:tspan><ns0:tspan x="1346.5" dy="14">policy.roundoff_squared?</ns0:tspan></ns0:text><ns0:rect x="1208.0" y="791.0" width="155" height="42" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:rect><ns0:text x="1285.5" y="815.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1285.5" dy="0">height_sq = 0.0</ns0:tspan></ns0:text><ns0:rect x="1224.083740234375" y="862.0" width="244.83251953125" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:rect><ns0:text x="1346.5" y="883.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1346.5" dy="0">height = math.sqrt(max(0, height_sq))</ns0:tspan><ns0:tspan x="1346.5" dy="14">ue, un = target[0] / distance, target[1] /</ns0:tspan><ns0:tspan x="1346.5" dy="14">distance</ns0:tspan><ns0:tspan x="1346.5" dy="14">candidates = []</ns0:tspan></ns0:text><ns0:polygon points="1346.5,969.0 1505.923828125,993.0 1346.5,1017.0 1187.076171875,993.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:polygon><ns0:text x="1346.5" y="996.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1346.5" dy="0">More sign values in (1, -1)?</ns0:tspan></ns0:text><ns0:rect x="986.812255859375" y="1046.0" width="239.37548828125" height="64" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:rect><ns0:text x="1106.5" y="1067.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1106.5" dy="0">east = along * ue - sign * height * un</ns0:tspan><ns0:tspan x="1106.5" dy="14">north = along * un + sign * height * ue</ns0:tspan><ns0:tspan x="1106.5" dy="14">candidate = list(sides)</ns0:tspan></ns0:text><ns0:rect x="1071.39892578125" y="1139.0" width="268.2021484375" height="92" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>vector_azimuth — traverse_solver.py:183–185</ns0:title></ns0:rect><ns0:line x1="1079.39892578125" y1="1139.0" x2="1079.39892578125" y2="1231.0" stroke="#33548b" /><ns0:line x1="1331.60107421875" y1="1139.0" x2="1331.60107421875" y2="1231.0" stroke="#33548b" /><ns0:text x="1205.5" y="1160.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1205.5" dy="0">candidate[i] = replace(sides[i],</ns0:tspan><ns0:tspan x="1205.5" dy="14">    azimuth=vector_azimuth(east, north))</ns0:tspan><ns0:tspan x="1205.5" dy="14">candidate[j] = replace(sides[j],</ns0:tspan><ns0:tspan x="1205.5" dy="14">    azimuth=vector_azimuth(target[0] - east,</ns0:tspan><ns0:tspan x="1205.5" dy="14">target[1] - north))</ns0:tspan></ns0:text><ns0:rect x="1198.278564453125" y="1260.0" width="192.44287109375" height="42" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:rect><ns0:text x="1294.5" y="1284.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1294.5" dy="0">candidates.append(candidate)</ns0:tspan></ns0:text><ns0:ellipse cx="1346.5" cy="1078.0" rx="91.44999999999999" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_iv — traverse_solver.py:278–303</ns0:title></ns0:ellipse><ns0:text x="1346.5" y="1081.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1346.5" dy="0">return candidates</ns0:tspan></ns0:text><ns0:rect x="603.13818359375" y="344.09000000000003" width="21.7236328125" height="14" fill="white" /><ns0:text x="614.0" y="354.09000000000003" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="614.0" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="779.380615234375" y="339.15" width="18.23876953125" height="14" fill="white" /><ns0:text x="788.5" y="349.15" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="788.5" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="370.27818359375" y="487.0" width="21.7236328125" height="14" fill="white" /><ns0:text x="381.14" y="497.0" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="381.14" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="522.880615234375" y="455.37" width="18.23876953125" height="14" fill="white" /><ns0:text x="532.0" y="465.37" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="532.0" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="873.13818359375" y="468.71000000000004" widt