<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1291" height="990" viewBox="0 0 1291.0 990.0"><ns0:rect x="0" y="0" width="1291.0" height="990.0" fill="white" /><ns0:text x="36" y="28" fill="#203849" font-size="16" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="36" dy="0">05  Cases I and III — omitted lengths</ns0:tspan></ns0:text><ns0:text x="36" y="48" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="36" dy="0">Case I: Length &amp; Bearing of One Side Omitted • Case III: Length of Two Sides Omitted. Independent function entries; exceptions propagate through solve_traverse() to TraverseApp.solve().</ns0:tspan></ns0:text><ns0:polyline points="421.5,147.04000000000002 421.5,168.75 421.5,175.75" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="421.5,175.75 424.5,168.75 418.5,168.75" fill="#465b68" /><ns0:polyline points="421.5,240.14 421.5,275.86 421.5,282.86" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="421.5,282.86 424.5,275.86 418.5,275.86" fill="#465b68" /><ns0:polyline points="321.5,314.97 321.5,386.2 321.5,393.2" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="321.5,393.2 324.5,386.2 318.5,386.2" fill="#465b68" /><ns0:polyline points="483.75,321.3 483.75,373.69 483.75,380.69" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="483.75,380.69 486.75,373.69 480.75,373.69" fill="#465b68" /><ns0:polyline points="497.5,445.1 497.5,489.41999999999996 497.5,496.41999999999996" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="497.5,496.41999999999996 500.5,489.41999999999996 494.5,489.41999999999996" fill="#465b68" /><ns0:polyline points="870.5,147.04000000000002 870.5,175.82 870.5,182.82" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="870.5,182.82 873.5,175.82 867.5,175.82" fill="#465b68" /><ns0:polyline points="870.5,233.24 870.5,261.71 870.5,268.71" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="870.5,268.71 873.5,261.71 867.5,261.71" fill="#465b68" /><ns0:polyline points="850.5,339.09 850.5,371.81 850.5,378.81" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="850.5,378.81 853.5,371.81 847.5,371.81" fill="#465b68" /><ns0:polyline points="993.0,308.84 993.0,366.8 993.0,373.8" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="993.0,373.8 996.0,366.8 990.0,366.8" fill="#465b68" /><ns0:polyline points="1120.5,452.24 1120.5,473.77 1120.5,480.77" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="1120.5,480.77 1123.5,473.77 1117.5,473.77" fill="#465b68" /><ns0:polyline points="1120.5,559.0699999999999 1120.5,580.9 1120.5,587.904" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="1120.5,587.904 1123.5,580.904 1117.5,580.904" fill="#465b68" /><ns0:ellipse cx="421.5" cy="123.5" rx="123.3079833984375" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_i — traverse_solver.py:224–231</ns0:title></ns0:ellipse><ns0:text x="421.5" y="127.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="421.5" dy="0">solve_case_i(sides, target, policy)</ns0:tspan></ns0:text><ns0:rect x="307.758056640625" y="176.0" width="227.48388671875" height="64" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_i — traverse_solver.py:224–231</ns0:title></ns0:rect><ns0:text x="421.5" y="197.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="421.5" dy="0">i = next(i for i, s in enumerate(sides)</ns0:tspan><ns0:tspan x="421.5" dy="14">         if s.length is None)</ns0:tspan><ns0:tspan x="421.5" dy="14">length = math.hypot(*target)</ns0:tspan></ns0:text><ns0:polygon points="421.5,283.0 568.76904296875,307.0 421.5,331.0 274.23095703125,307.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_i — traverse_solver.py:224–231</ns0:title></ns0:polygon><ns0:text x="421.5" y="310.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="421.5" dy="0">length &lt;= policy.length?</ns0:tspan></ns0:text><ns0:ellipse cx="202.5" cy="413.0" rx="166.5514111328125" ry="28.000000000000004" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_i — traverse_solver.py:224–231</ns0:title></ns0:ellipse><ns0:text x="202.5" y="409.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="202.5" dy="0">raise TraverseError("The omitted side has zero</ns0:tspan><ns0:tspan x="202.5" dy="14">length; its bearing is indeterminate.")</ns0:tspan></ns0:text><ns0:rect x="398.4345703125" y="381.0" width="198.130859375" height="64" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_i — traverse_solver.py:224–231</ns0:title></ns0:rect><ns0:text x="497.5" y="402.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="497.5" dy="0">result = list(sides)</ns0:tspan><ns0:tspan x="497.5" dy="14">result[i] = TraverseSide(length,</ns0:tspan><ns0:tspan x="497.5" dy="14">vector_azimuth(*target))</ns0:tspan></ns0:text><ns0:ellipse cx="497.5" cy="520.0" rx="91.44999999999999" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_i — traverse_solver.py:224–231</ns0:title></ns0:ellipse><ns0:text x="497.5" y="523.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="497.5" dy="0">return [result]</ns0:tspan></ns0:text><ns0:ellipse cx="870.5" cy="123.5" rx="126.9142431640625" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_iii — traverse_solver.py:265–275</ns0:title></ns0:ellipse><ns0:text x="870.5" y="127.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="870.5" dy="0">solve_case_iii(sides, target, policy)</ns0:tspan></ns0:text><ns0:rect x="766.58447265625" y="183.0" width="207.8310546875" height="50" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>_length_system — traverse_solver.py:258–262</ns0:title></ns0:rect><ns0:line x1="774.58447265625" y1="183.0" x2="774.58447265625" y2="233.0" stroke="#33548b" /><ns0:line x1="966.41552734375" y1="183.0" x2="966.41552734375" y2="233.0" stroke="#33548b" /><ns0:text x="870.5" y="204.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="870.5" dy="0">i, j, ae, an, be, bn, determinant =</ns0:tspan><ns0:tspan x="870.5" dy="14">_length_system(sides)</ns0:tspan></ns0:text><ns0:polygon points="870.5,269.0 998.5888671875,307.0 870.5,345.0 742.4111328125,307.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>solve_case_iii — traverse_solver.py:265–275</ns0:title></ns0:polygon><ns0:text x="870.5" y="303.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="870.5" dy="0">abs(determinant) &lt;=</ns0:tspan><ns0:tspan x="870.5" dy="14">policy.singular?</ns0:tspan></ns0:text><ns0:ellipse cx="795.5" cy="413.0" rx="163.1543017578125" ry="35.84" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_iii — traverse_solver.py:265–275</ns0:title></ns0:ellipse><ns0:text x="795.5" y="402.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="795.5" dy="0">raise TraverseError("Singular system: the two</ns0:tspan><ns0:tspan x="795.5" dy="14">bearings are parallel or opposite; the missing</ns0:tspan><ns0:tspan x="795.5" dy="14">lengths cannot be uniquely determined.")</ns0:tspan></ns0:text><ns0:rect x="987.588623046875" y="374.0" width="265.82275390625" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_iii — traverse_solver.py:265–275</ns0:title></ns0:rect><ns0:text x="1120.5" y="395.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1120.5" dy="0">east, north = target</ns0:tspan><ns0:tspan x="1120.5" dy="14">first = (east * bn - be * north) / determinant</ns0:tspan><ns0:tspan x="1120.5" dy="14">second = (ae * north - east * an) /</ns0:tspan><ns0:tspan x="1120.5" dy="14">determinant</ns0:tspan></ns0:text><ns0:rect x="986.202880859375" y="481.0" width="268.59423828125" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>solve_case_iii — traverse_solver.py:265–275</ns0:title></ns0:rect><ns0:text x="1120.5" y="502.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1120.5" dy="0">candidate = list(sides)</ns0:tspan><ns0:tspan x="1120.5" dy="14">candidate[i] = replace(sides[i], length=first)</ns0:tspan><ns0:tspan x="1120.5" dy="14">candidate[j] = replace(sides[j],</ns0:tspan><ns0:tspan x="1120.5" dy="14">length=second)</ns0:tspan></ns0:text><ns0:ellipse cx="1120.5" cy="611.5" rx="91.44999999999999" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>solve_case_iii — traverse_solver.py:265–275</ns0:title></ns0:ellipse><ns0:text x="1120.5" y="615.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1120.5" dy="0">return [candidate]</ns0:tspan></ns0:text><ns0:rect x="36" y="670.0" width="1219.0" height="85" fill="#f6f7f9" stroke="#75828c" stroke-width="1.1" rx="0"><ns0:title>_length_system — traverse_solver.py:258–262</ns0:title></ns0:rect><ns0:text x="48" y="687.0" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="48" dy="0">_length_system(sides):</ns0:tspan><ns0:tspan x="48" dy="13">i, j = [i for i, s in enumerate(sides) if s.length is None]</ns0:tspan><ns0:tspan x="48" dy="13">ae, an = unit_vector(sides[i].azimuth)</ns0:tspan><ns0:tspan x="48" dy="13">be, bn = unit_vector(sides[j].azimuth)</ns0:tspan><ns0:tspan x="48" dy="13">return i, j, ae, an, be, bn, ae * bn - be * an</ns0:tspan></ns0:text><ns0:rect x="36" y="765.0" width="1219.0" height="72" fill="#f6f7f9" stroke="#75828c" stroke-width="1.1" rx="0"><ns0:title>NumericalPolicy — traverse_solver.py:109–127</ns0:title></ns0:rect><ns0:text x="48" y="782.0" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="48" dy="0">NumericalPolicy.length: return self.scale * self.relative</ns0:tspan><ns0:tspan x="48" dy="13">relative: float = 1e-10</ns0:tspan><ns0:tspan x="48" dy="13">singular = 64 * sys.float_info.epsilon</ns0:tspan><ns0:tspan x="48" dy="13">Positive candidate lengths and closure are checked later in solve_traverse().</ns0:tspan></ns0:text><ns0:rect x="36" y="847.0" width="1219.0" height="85" fill="#f6f7f9" stroke="#75828c" stroke-width="1.1" rx="0"><ns0:title>vector_azimuth — traverse_solver.py:183–185</ns0:title></ns0:rect><ns0:text x="48" y="864.0" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="48" dy="0">unit_vector(angle):</ns0:tspan><ns0:tspan x="48" dy="13">return math.sin(math.radians(angle)), math.cos(math.radians(angle))</ns0:tspan><ns0:tspan x="48" dy="13">vector_azimuth(east, north):</ns0:tspan><ns0:tspan x="48" dy="13">angle = math.degrees(math.atan2(east, north)) % 360</ns0:tspan><ns0:tspan x="48" dy="13">return 0.0 if angle == 360 else angle</ns0:tspan></ns0:text><ns0:rect x="303.13818359375" y="338.58" width="21.7236328125" height="14" fill="white" /><ns0:text x="314.0" y="348.58" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="314.0" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="468.130615234375" y="335.49" width="18.23876953125" height="14" fill="white" /><ns0:text x="477.25" y="345.49" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="477.25" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="832.13818359375" y="343.45" width="21.7236328125" height="14" fill="white" /><ns0:text x="843.0" y="353.45" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="843.0" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="990.380615234375" y="335.82" width="18.23876953125" height="14" fill="white" /><ns0:text x="999.5" y="345.82" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="999.5" dy="0">No</ns0:tspan></ns0:text><ns0:text x="36" y="971.0" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="36" dy="0">traverse_solver.py · 0cf64fb · source SHA-256 e18d3a23955f4292…</ns0:tspan></ns0:text><ns0:text x="1255.0" y="971.0" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="end"><ns0:tspan x="1255.0" dy="0">14 / 27</ns0:tspan></ns0:text></ns0:svg>