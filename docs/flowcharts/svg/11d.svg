plain_result — traverse_solver.py:324–369</ns0:title></ns0:rect><ns0:text x="137.0" y="869.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="137.0" dy="0">Append solved.length with .12g.</ns0:tspan></ns0:text><ns0:polygon points="263.0,916.0 412.47119140625,940.0 263.0,964.0 113.52880859375,940.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>explain_result — traverse_solver.py:324–369</ns0:title></ns0:polygon><ns0:text x="263.0" y="943.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="263.0" dy="0">original.azimuth is None?</ns0:tspan></ns0:text><ns0:rect x="243.739013671875" y="993.0" width="232.52197265625" height="50" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>quadrantal — traverse_solver.py:82–95</ns0:title></ns0:rect><ns0:text x="360.0" y="1014.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="360.0" dy="0">Append solved.azimuth with .12g and</ns0:tspan><ns0:tspan x="360.0" dy="14">quadrantal(solved.azimuth).</ns0:tspan></ns0:text><ns0:rect x="593.19287109375" y="752.0" width="275.6142578125" height="64" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>explain_result — traverse_solver.py:324–369</ns0:title></ns0:rect><ns0:text x="731.0" y="773.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="731.0" dy="0">Append substitution residual: solution.sum_e,</ns0:tspan><ns0:tspan x="731.0" dy="14">solution.sum_n, solution.closure; then</ns0:tspan><ns0:tspan x="731.0" dy="14">solution.warnings.</ns0:tspan></ns0:text><ns0:ellipse cx="609.0" cy="554.0" rx="113.32263671874999" ry="35.84" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>explain_result — traverse_solver.py:324–369</ns0:title></ns0:ellipse><ns0:text x="609.0" y="543.85" fill="#203849" font-size="11" font-famil