<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="831" height="1513" viewBox="0 0 830.5 1513.0"><ns0:rect x="0" y="0" width="830.5" height="1513.0" fill="white" /><ns0:text x="36" y="28" fill="#203849" font-size="16" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="36" dy="0">08b  Polygon boundary checks and shoelace area</ns0:tspan></ns0:text><ns0:text x="36" y="48" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="36" dy="0">polygon_area(points, policy): return None for adjacent retracing, non-neighbor intersections or touching, or area at/below</ns0:tspan><ns0:tspan x="36" dy="13">cross_tol. Called with local coordinates by evaluate_solution().</ns0:tspan></ns0:text><ns0:polyline points="424.5,147.05999999999995 424.5,168.9000000000001 424.5,175.9000000000001" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="424.5,175.9000000000001 427.5,168.9000000000001 421.5,168.9000000000001" fill="#465b68" /><ns0:polyline points="424.5,254.01999999999998 424.5,275.87 424.5,282.87" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="424.5,282.87 427.5,275.87 421.5,275.87" fill="#465b68" /><ns0:polyline points="286.5,314.77 286.5,352.65 286.5,359.65" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="286.5,359.65 289.5,352.65 283.5,352.65" fill="#465b68" /><ns0:polyline points="561.0,315.1 561.0,359.62 561.0,366.62" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="561.0,366.62 564.0,359.62 558.0,359.62" fill="#465b68" /><ns0:polyline points="239.5,452.21000000000004 239.5,482.99 239.5,489.99" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="239.5,489.99 242.5,482.99 236.5,482.99" fill="#465b68" /><ns0:polyline points="302.75,556.83 302.75,619.82 302.75,626.82" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="302.75,626.82 305.75,619.82 299.75,619.82" fill="#465b68" /><ns0:polyline points="126.25,560.27 126.25,684.04 126.25,1187.0 331.8,1187.0 338.8,1187.0" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="338.8,1187.0 331.8,1184.0 331.8,1190.0" fill="#465b68" /><ns0:polyline points="438.25,619.73 438.25,336.47 438.25,329.47" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="438.25,329.47 435.25,336.47 441.25,336.47" fill="#465b68" /><ns0:polyline points="339.17,654.27 339.17,695.88 339.17,702.88" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="339.17,702.88 342.17,695.88 336.17,695.88" fill="#465b68" /><ns0:polyline points="453.83,702.6800000000001 453.83,661.25 453.83,654.25" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="453.83,654.25 450.83,661.25 456.83,661.25" fill="#465b68" /><ns0:polyline points="409.5,764.29 409.5,788.89 409.5,795.89" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="409.5,795.89 412.5,788.89 406.5,788.89" fill="#465b68" /><ns0:polyline points="414.0,838.0899999999999 414.0,859.9200000000001 414.0,866.9200000000001" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="414.0,866.9200000000001 417.0,859.9200000000001 411.0,859.9200000000001" fill="#465b68" /><ns0:polyline points="423.5,945.27 423.5,969.74 423.5,976.74" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="423.5,976.74 426.5,969.74 420.5,969.74" fill="#465b68" /><ns0:polyline points="580.5,1035.59 580.5,955.08 580.5,638.0 575.71,638.0 568.71,638.0" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="568.71,638.0 575.71,641.0 575.71,635.0" fill="#465b68" /><ns0:polyline points="430.5,1134.13 430.5,1155.96 430.5,1162.964" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="430.5,1162.964 433.5,1155.964 427.5,1155.964" fill="#465b68" /><ns0:polyline points="679.0,445.14 679.0,504.16999999999996 679.0,511.16999999999996" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="679.0,511.16999999999996 682.0,504.16999999999996 676.0,504.16999999999996" fill="#465b68" /><ns0:polyline points="689.5,557.09 689.5,607.38 689.5,614.38" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="689.5,614.38 692.5,607.38 686.5,607.38" fill="#465b68" /><ns0:polyline points="787.75,534.88 787.75,573.24 787.75,1187.0 529.04,1187.0 522.04,1187.0" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="522.04,1187.0 529.04,1190.0 529.04,1184.0" fill="#465b68" /><ns0:ellipse cx="424.5" cy="123.5" rx="106.186171875" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:ellipse><ns0:text x="424.5" y="127.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="424.5" dy="0">polygon_area(points, policy)</ns0:tspan></ns0:text><ns0:rect x="332.44921875" y="176.0" width="184.1015625" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:rect><ns0:text x="424.5" y="197.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="424.5" dy="0">vertices = points[:-1]</ns0:tspan><ns0:tspan x="424.5" dy="14">count = len(vertices)</ns0:tspan><ns0:tspan x="424.5" dy="14">tol, cross_tol = policy.length,</ns0:tspan><ns0:tspan x="424.5" dy="14">policy.squared_length</ns0:tspan></ns0:text><ns0:polygon points="424.5,283.0 626.57568359375,307.0 424.5,331.0 222.42431640625,307.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:polygon><ns0:text x="424.5" y="310.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="424.5" dy="0">More (i, a) in enumerate(vertices)?</ns0:tspan></ns0:text><ns0:rect x="128.25830078125" y="360.0" width="222.4833984375" height="92" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:rect><ns0:text x="239.5" y="381.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="239.5" dy="0">b = vertices[(i + 1) % count]</ns0:tspan><ns0:tspan x="239.5" dy="14">previous = vertices[i - 1]</ns0:tspan><ns0:tspan x="239.5" dy="14">retraces = sum((p - q) * (r - q)</ns0:tspan><ns0:tspan x="239.5" dy="14">    for p, q, r in zip(previous, a, b)) &gt;</ns0:tspan><ns0:tspan x="239.5" dy="14">tol**2</ns0:tspan></ns0:text><ns0:polygon points="208.5,481.0 380.79296875,533.0 208.5,585.0 36.20703125,533.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:polygon><ns0:text x="208.5" y="522.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="208.5" dy="0">abs(cross(previous, a, b)) &lt;=</ns0:tspan><ns0:tspan x="208.5" dy="14">cross_tol</ns0:tspan><ns0:tspan x="208.5" dy="14">and retraces?</ns0:tspan></ns0:text><ns0:polygon points="396.5,614.0 568.28271484375,638.0 396.5,662.0 224.71728515625,638.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:polygon><ns0:text x="396.5" y="641.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="396.5" dy="0">More j in range(i + 1, count)?</ns0:tspan></ns0:text><ns0:polygon points="396.5,691.0 576.31787109375,729.0 396.5,767.0 216.68212890625,729.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:polygon><ns0:text x="396.5" y="725.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="396.5" dy="0">j == i + 1</ns0:tspan><ns0:tspan x="396.5" dy="14">or (i == 0 and j == count - 1)?</ns0:tspan></ns0:text><ns0:rect x="280.396728515625" y="796.0" width="258.20654296875" height="42" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:rect><ns0:text x="409.5" y="820.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="409.5" dy="0">c, d = vertices[j], vertices[(j + 1) % count]</ns0:tspan></ns0:text><ns0:rect x="289.29150390625" y="867.0" width="268.4169921875" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:rect><ns0:text x="423.5" y="888.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="423.5" dy="0">crosses = opposite(cross(a, b, c), cross(a, b,</ns0:tspan><ns0:tspan x="423.5" dy="14">d))</ns0:tspan><ns0:tspan x="423.5" dy="14">crosses &amp;= opposite(cross(c, d, a), cross(c,</ns0:tspan><ns0:tspan x="423.5" dy="14">d, b))</ns0:tspan></ns0:text><ns0:polygon points="430.5,974.0 624.76611328125,1054.0 430.5,1134.0 236.23388671875,1054.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:polygon><ns0:text x="430.5" y="1029.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="430.5" dy="0">crosses or any((on_segment(a, b,</ns0:tspan><ns0:tspan x="430.5" dy="14">c),</ns0:tspan><ns0:tspan x="430.5" dy="14">    on_segment(a, b, d),</ns0:tspan><ns0:tspan x="430.5" dy="14">on_segment(c, d, a),</ns0:tspan><ns0:tspan x="430.5" dy="14">    on_segment(c, d, b)))?</ns0:tspan></ns0:text><ns0:rect x="495.3662109375" y="367.0" width="278.267578125" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:rect><ns0:text x="634.5" y="388.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="634.5" dy="0">area = abs(math.fsum(a[0] * b[1] - b[0] * a[1]</ns0:tspan><ns0:tspan x="634.5" dy="14">    for a, b in zip(vertices,</ns0:tspan><ns0:tspan x="634.5" dy="14">                    vertices[1:] +</ns0:tspan><ns0:tspan x="634.5" dy="14">vertices[:1]))) / 2</ns0:tspan></ns0:text><ns0:polygon points="689.5,509.0 794.68115234375,533.0 689.5,557.0 584.31884765625,533.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:polygon><ns0:text x="689.5" y="536.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="689.5" dy="0">area &gt; cross_tol?</ns0:tspan></ns0:text><ns0:ellipse cx="689.5" cy="638.0" rx="91.44999999999999" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:ellipse><ns0:text x="689.5" y="641.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="689.5" dy="0">return area</ns0:tspan></ns0:text><ns0:ellipse cx="430.5" cy="1186.5" rx="91.44999999999999" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:ellipse><ns0:text x="430.5" y="1190.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="430.5" dy="0">return None</ns0:tspan></ns0:text><ns0:rect x="36" y="1245.0" width="758.5" height="59" fill="#f6f7f9" stroke="#75828c" stroke-width="1.1" rx="0"><ns0:title>polygon_area.cross — traverse_solver.py:194–195</ns0:title></ns0:rect><ns0:text x="48" y="1262.0" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="48" dy="0">cross(a, b, c):</ns0:tspan><ns0:tspan x="48" dy="13">return (b[0] - a[0]) * (c[1] - a[1])</ns0:tspan><ns0:tspan x="48" dy="13">       - (b[1] - a[1]) * (c[0] - a[0])</ns0:tspan></ns0:text><ns0:rect x="36" y="1314.0" width="758.5" height="59" fill="#f6f7f9" stroke="#75828c" stroke-width="1.1" rx="0"><ns0:title>polygon_area.opposite — traverse_solver.py:202–203</ns0:title></ns0:rect><ns0:text x="48" y="1331.0" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="48" dy="0">opposite(a, b):</ns0:tspan><ns0:tspan x="48" dy="13">return (a &gt; cross_tol and b &lt; -cross_tol)</ns0:tspan><ns0:tspan x="48" dy="13">    or (a &lt; -cross_tol and b &gt; cross_tol)</ns0:tspan></ns0:text><ns0:rect x="36" y="1383.0" width="758.5" height="72" fill="#f6f7f9" stroke="#75828c" stroke-width="1.1" rx="0"><ns0:title>polygon_area.on_segment — traverse_solver.py:197–200</ns0:title></ns0:rect><ns0:text x="48" y="1400.0" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="48" dy="0">on_segment(a, b, p):</ns0:tspan><ns0:tspan x="48" dy="13">return (abs(cross(a, b, p)) &lt;= cross_tol</ns0:tspan><ns0:tspan x="48" dy="13">    and min(a[0], b[0]) - tol &lt;= p[0] &lt;= max(a[0], b[0]) + tol</ns0:tspan><ns0:tspan x="48" dy="13">    and min(a[1], b[1]) - tol &lt;= p[1] &lt;= max(a[1], b[1]) + tol)</ns0:tspan></ns0:text><ns0:rect x="268.13818359375" y="331.71000000000004" width="21.7236328125" height="14" fill="white" /><ns0:text x="279.0" y="341.71000000000004" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="279.0" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="545.380615234375" y="335.36" width="18.23876953125" height="14" fill="white" /><ns0:text x="554.5" y="345.36" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="554.5" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="287.130615234375" y="586.32" width="18.23876953125" height="14" fill="white" /><ns0:text x="296.25" y="596.32" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="296.25" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="107.88818359375" y="964.41" width="21.7236328125" height="14" fill="white" /><ns0:text x="118.75" y="974.41" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="118.75" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="422.630615234375" y="466.1" width="18.23876953125" height="14" fill="white" /><ns0:text x="431.75" y="476.1" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="431.75" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="320.80818359375" y="663.08" width="21.7236328125" height="14" fill="white" /><ns0:text x="331.67" y="673.08" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="331.67" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="381.040693359375" y="669.97" width="75.57861328125001" height="14" fill="white" /><ns0:text x="418.83" y="679.97" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="418.83" dy="0">Yes — continue</ns0:tspan></ns0:text><ns0:rect x="393.880615234375" y="764.5899999999999" width="18.23876953125" height="14" fill="white" /><ns0:text x="403.0" y="774.5899999999999" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="403.0" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="564.880615234375" y="822.4" width="18.23876953125" height="14" fill="white" /><ns0:text x="574.0" y="832.4" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="574.0" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="412.13818359375" y="1133.048" width="21.7236328125" height="14" fill="white" /><ns0:text x="423.0" y="1143.048" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="423.0" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="671.13818359375" y="570.24" width="21.7236328125" height="14" fill="white" /><ns0:text x="682.0" y="580.24" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="682.0" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="772.130615234375" y="978.29" width="18.23876953125" height="14" fill="white" /><ns0:text x="781.25" y="988.29" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="781.25" dy="0">No</ns0:tspan></ns0:text><ns0:text x="36" y="1494.0" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="36" dy="0">traverse_solver.py · 0cf64fb · source SHA-256 e18d3a23955f4292…</ns0:tspan></ns0:text><ns0:text x="794.5" y="1494.0" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="end"><ns0:tspan x="794.5" dy="0">18 / 27</ns0:tspan></ns0:text></ns0:svg>