e_solver.py:45–63</ns0:title></ns0:rect><ns0:text x="511.5" y="197.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="511.5" dy="0">Strip str(text); normalize º / ′ / ″ /</ns0:tspan><ns0:tspan x="511.5" dy="14">doubled apostrophes / curly apostrophes.</ns0:tspan></ns0:text><ns0:polygon points="511.5,255.0 707.93603515625,293.0 511.5,331.0 315.06396484375,293.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>parse_angle — traverse_solver.py:45–63</ns0:title></ns0:polygon><ns0:text x="511.5" y="289.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="511.5" dy="0">re.fullmatch(_DECIMAL + r"\s*°?",</ns0:tspan><ns0:tspan x="511.5" dy="14">text)?</ns0:tspan></ns0:text><ns0:rect x="250.828369140625" y="360.0" width="239.34326171875" height="50" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>number — traverse_solver.py:35–42</ns0:title></ns0:rect><ns0:line x1="258.828369140625" y1="360.0" x2="258.828369140625" y2="410.0" stroke="#33548b" /><ns0:line x1="482.171630859375" y1="360.0" x2="482.171630859375" y2="410.0" stroke="#33548b" /><ns0:text x="370.5" y="381.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="370.5" dy="0">number(text.rstrip("°").strip(), "Angle")</ns0:tspan><ns0:tspan x="370.5" dy="14">See page 03a.</ns0:tspan></ns0:text><ns0:ellipse cx="127.5" cy="467.0" rx="91.44999999999999" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>parse_angle — traverse_solver.py:45–63</ns0:title></ns0:ellipse><ns0:text x="127.5" y="470.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="127.5" dy="0">Return number() result</ns0:tspan></ns0:text><ns0:rect x="528.040771484375" y="360.0" width="266.91845703125" height="50" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>parse_angle — traverse_solver.py:45–63</ns0:title></ns0:rect><ns0:text x="661.5" y="381.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="661.5" dy="0">patterns = (symbol DMS, colon/space DMS)</ns0:tspan><ns0:tspan x="661.5" dy="14">Use the two exact regexes in parse_angle().</ns0:tspan></ns0:text><ns0:polygon points="671.5,443.0 820.62744140625,467.0 671.5,491.0 522.37255859375,467.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>parse_angle — traverse_solver.py:45–63</ns0:title></ns0:polygon><ns0:text x="671.5" y="470.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="671.5" dy="0">Next pattern in patterns?</ns0:tspan></ns0:text><ns0:polygon points="671.5,524.0 877.12060546875,562.0 671.5,600.0 465.87939453125,562.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>parse_angle — traverse_solver.py:45–63</ns0:title></ns0:polygon><ns0:text x="671.5" y="558.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="671.5" dy="0">match = re.fullmatch(pattern, text)</ns0:tspan><ns0:tspan x="671.5" dy="14">match?</ns0:tspan></ns0:text><ns0:rect x="541.41650390625" y="629.0" width="260.1669921875" height="50" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>parse_angle — traverse_solver.py:45–63</ns0:title></ns0:rect><ns0:text x="671.5" y="650.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="671.5" dy="0">degrees, minutes, seconds =</ns0:tspan><ns0:tspan x="671.5" dy="14">(float(part or 0) for part in match.groups())</ns0:tspan></ns0:text><ns0:polygon points="671.5,708.0 864.92822265625,732.0 671.5,756.0 478.07177734375,732.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>parse_angle — traverse_solver.py:45–63</ns0:title></ns0:polygon><ns0:text x="671.5" y="735.85" fill="#203849" font-size=