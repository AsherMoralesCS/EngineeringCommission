/><ns0:polygon points="1291.5,900.87 1294.5,893.87 1288.5,893.87" fill="#465b68" /><ns0:ellipse cx="550.5" cy="123.5" rx="91.44999999999999" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:ellipse><ns0:text x="550.5" y="127.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="550.5" dy="0">InputModel.load(path)</ns0:tspan></ns0:text><ns0:polygon points="427.967626953125,176.0 711.726806640625,176.0 673.032373046875,226.0 389.273193359375,226.0" fill="#ebf5ef" stroke="#315f4b" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:polygon><ns0:text x="550.5" y="197.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="550.5" dy="0">data =</ns0:tspan><ns0:tspan x="550.5" dy="14">json.loads(Path(path).read_text(encoding='utf-8'))</ns0:tspan></ns0:text><ns0:polygon points="365.5,255.0 543.73876953125,307.0 365.5,359.0 187.26123046875,307.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:polygon><ns0:text x="365.5" y="296.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="365.5" dy="0">data is dict;</ns0:tspan><ns0:tspan x="365.5" dy="14">type(data.get('version')) is int;</ns0:tspan><ns0:tspan x="365.5" dy="14">and data['version'] == 1?</ns0:tspan></ns0:text><ns0:ellipse cx="186.5" cy="440.0" rx="150.443662109375" ry="35.84" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:ellipse><ns0:text x="186.5" y="429.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="186.5" dy="0">raise TraverseError</ns0:tspan><ns0:tspan x="186.5" dy="14">Unsupported traverse input file (version 1</ns0:tspan><ns0:tspan x="186.5" dy="14">required).</ns0:tspan></ns0:text><ns0:polygon points="545.5,388.0 725.2158203125,440.0 545.5,492.0 365.7841796875,440.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:polygon><ns0:text x="545.5" y="429.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="545.5" dy="0">rows = data.get('rows')</ns0:tspan><ns0:tspan x="545.5" dy="14">isinstance(rows, list) and 3 &lt;=</ns0:tspan><ns0:tspan x="545.5" dy="14">len(rows) &lt;= 20?</ns0:tspan></ns0:text><ns0:ellipse cx="411.5" cy="553.0" rx="124.6389404296875" ry="28.000000000000004" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:ellipse><ns0:text x="411.5" y="549.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="411.5" dy="0">raise TraverseError</ns0:tspan><ns0:tspan x="411.5" dy="14">Input file must contain 3–20 rows.</ns0:tspan></ns0:text><ns0:rect x="565.48681640625" y="521.0" width="228.0263671875" height="64" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:rect><ns0:text x="679.5" y="542.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="679.5" dy="0">fields = {"length": str, "bearing": str,</ns0:tspan><ns0:tspan x="679.5" dy="14">          "length_unknown": bool,</ns0:tspan><ns0:tspan x="679.5" dy="14">"bearing_unknown": bool}</ns0:tspan></ns0:text><ns0:polygon points="679.5,614.0 787.90380859375,638.0 679.5,662.0 571.09619140625,638.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:polygon><ns0:text x="679.5" y="641.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="679.5" dy="0">Next row in rows?</ns0:tspan></ns0:text><ns0:polygon points="440.5,691.0 635.44287109375,729.0 440.5,767.0 245.55712890625,729.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:polygon><ns0:text x="440.5" y="725.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="440.5" dy="0">isinstance(row, dict) and set(row)</ns0:tspan><ns0:tspan x="440.5" dy="14">== set(fields)?</ns0:tspan></ns0:text><ns0:ellipse cx="292.5" cy="834.0" rx="111.2850048828125" ry="28.000000000000004" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:ellipse><ns0:text x="292.5" y="830.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="292.5" dy="0">raise TraverseError</ns0:tspan><ns0:tspan x="292.5" dy="14">Invalid side fields in input file.</ns0:tspan></ns0:text><ns0:polygon points="610.5,796.0 787.31005859375,834.0 610.5,872.0 433.68994140625,834.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:polygon><ns0:text x="610.5" y="830.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="610.5" dy="0">Any type(row[key]) is not kind</ns0:tspan><ns0:tspan x="610.5" dy="14">for key, kind in fields.items()?</ns0:tspan></ns0:text><ns0:ellipse cx="610.5" cy="944.5" rx="164.7451123046875" ry="35.84" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:ellipse><ns0:text x="610.5" y="934.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="610.5" dy="0">raise TraverseError</ns0:tspan><ns0:tspan x="610.5" dy="14">Side values must be text; unknown flags must</ns0:tspan><ns0:tspan x="610.5" dy="14">be booleans.</ns0:tspan></ns0:text><ns0:polygon points="973.5,691.0 1153.56494140625,729.0 973.5,767.0 793.43505859375,729.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:polygon><ns0:text x="973.5" y="725.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="973.5" dy="0">data.get('unit') in ('m', 'ft') and</ns0:tspan><ns0:tspan x="973.5" dy="14">initial_e / initial_n are strings?</ns0:tspan></ns0:text><ns0:ellipse cx="973.5" cy="834.0" rx="156.57557128906248" ry="35.84" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:ellipse><ns0:text x="973.5" y="823.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="973.5" dy="0">raise TraverseError</ns0:tspan><ns0:tspan x="973.5" dy="14">Invalid units or starting coordinates in input</ns0:tspan><ns0:tspan x="973.5" dy="14">file.</ns0:tspan></ns0:text><ns0:rect x="1159.0908203125" y="809.0" width="264.818359375" height="50" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:rect><ns0:text x="1291.5" y="830.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1291.5" dy="0">Construct the InputModel instance from the</ns0:tspan><ns0:tspan x="1291.5" dy="14">saved row strings and flags.</ns0:tspan></ns0:text><ns0:ellipse cx="1291.5" cy="944.5" rx="159.11072753906248" ry="43.68000000000001" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:ellipse><ns0:text x="1291.5" y="927.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1291.5" dy="0">return cls([DraftSide(**row) for row in rows],</ns0:tspan><ns0:tspan x="1291.5" dy="14">    data["initial_e"], data["initial_n"],</ns0:tspan><ns0:tspan x="1291.5" dy="14">data["unit"])</ns0:tspan><ns0:tspan x="1291.5" dy="14">Return to TraverseApp.input_file() on 09a.</ns0:tspan></ns0:text><ns0:ellipse cx="736.5" cy="307.0" rx="164.30462890625" ry="35.84" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>InputModel.load — traverse_solver.py:474–493</ns0:title></ns0:ellipse><ns0:text x="736.5" y="296.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="736.5" dy="0">Read / JSON exceptions propagate unchanged</ns0:tspan><ns0:tspan x="736.5" dy="14">input_file catches OSError, ValueError,</ns0:tspan><ns0:tspan x="736.5" dy="14">TypeError</ns0:tspan></ns0:text><ns0:rect x="423.9257421875" y="239.32000000000005" width="42.22851562500001" height="14" fill="white" /><ns0:text x="445.04" y="249.32000000000005" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="445.04" dy="0">Success</ns0:tspan></ns0:text><ns0:rect x="556.488564453125" y="235.95000000000005" width="91.44287109375001" height="14" fill="white" /><ns0:text x="602.21" y="245.95000000000005" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="602.21" dy="0">Read / JSON failure</ns0:tspan></ns0:text><ns0:rect x="246.630615234375" y="363.38" width="18.23876953125" height="14" fill="white" /><ns0:text x="255.75" y="373.38" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="255.75" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="436.38818359375" y="358.03" width="21.7236328125" height="14" fill="white" /><ns0:text x="447.25" y="368.03" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="447.25" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="435.380615234375" y="490.04" width="18.23876953125" height="14" fill=