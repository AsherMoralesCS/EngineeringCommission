"14">match =</ns0:tspan><ns0:tspan x="738.5" dy="14">re.fullmatch(r"([NS])\s*(.*?)\s*([EW])", text)</ns0:tspan></ns0:text><ns0:polygon points="738.5,269.0 828.5,293.0 738.5,317.0 648.5,293.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>parse_bearing — traverse_solver.py:66–79</ns0:title></ns0:polygon><ns0:text x="738.5" y="296.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="738.5" dy="0">match?</ns0:tspan></ns0:text><ns0:rect x="512.8134765625" y="346.0" width="225.373046875" height="50" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>parse_angle — traverse_solver.py:45–63</ns0:title></ns0:rect><ns0:line x1="520.8134765625" y1="346.0" x2="520.8134765625" y2="396.0" stroke="#33548b" /><ns0:line x1="730.1865234375" y1="346.0" x2="730.1865234375" y2="396.0" stroke="#33548b" /><ns0:text x="625.5" y="367.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="625.5" dy="0">ns, angle_text, ew = match.groups()</ns0:tspan><ns0:tspan x="625.5" dy="14">angle = parse_angle(angle_text)</ns0:tspan></ns0:text><ns0:polygon points="468.5,429.0 586.7060546875,453.0 468.5,477.0 350.2939453125,453.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>parse_bearing — traverse_solver.py:66–79</ns0:title></ns0:polygon><ns0:text x="468.5" y="456.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="468.5" dy="0">0 &lt;= angle &lt;= 90?</ns0:tspan></ns0:text><ns0:ellipse cx="183.5" cy="553.5" rx="147.312744140625" ry="43.68000000000001" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>parse_bearing — traverse_solver.py:66–79</ns0:title></ns0:ellipse><ns0:text x="183.5" y="536.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="183.5" dy="0">return {("N", "E"): angle, ("S", "E"): 180 -</ns0:tspan><ns0:tspan x="183.5" dy="14">angle,</ns0:tspan><ns0:tspan x="183.5" dy="14">        ("S", "W"): 180 + angle, ("N", "W"):</ns0:tspan><ns0:tspan x="183.5" dy="14">360 - angle}[ns, ew] % 360</ns0:tspan></ns0:text><ns0:ellipse cx="532.5" cy="553.5" rx="172.0780517578125" ry="28.000000000000004" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>parse_bearing — traverse_solver.py:66–79</ns0:title></ns0:ellipse><ns0:text x="532.5" y="550.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="532.5" dy="0">Raise TraverseError:</ns0:tspan><ns0:tspan x="532.5" dy="14">Quadrantal angles must be between 0° and 90°.</ns0:tspan></ns0:text><ns0:rect x="767.51123046875" y="350.0" width="167.9775390625" height="42" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>parse_angle — traverse_solver.py:45–63</ns0:title></ns0:rect><ns0:line x1="775.51123046875" y1="350.0" x2="775.51123046875" y2="392.0" stroke="#33548b" /><ns0:line x1="927.48876953125" y1="350.0" x2="927.48876953125" y2="392.0" stroke="#33548b" /><ns0:text x="851.5" y="374.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="851.5" dy="0">angle = parse_angle(text)</ns0:tspan></ns0:text><ns0:polygon points="1015.5,429.0 1140.70458984375,453.0 1015.5,477.0 890.29541015625,453.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>parse_bearing — traverse_solver.py:66–79</ns0:title></ns0:polygon><ns0:text x="1015.5" y="456.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="1015.5" dy="0">0 &lt;= angle &lt;= 360?</ns0:tspan></ns0:text><ns0:ellipse cx="952.5" cy="553.5" rx="91.44999999999999" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>parse_bearing — traverse_solver.py:66–79</ns0:title></ns0:ellipse><ns0:text x="952.5" y="557.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-an