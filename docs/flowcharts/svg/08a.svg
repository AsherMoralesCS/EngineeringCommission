<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="794" height="1207" viewBox="0 0 794.0 1207.0"><ns0:rect x="0" y="0" width="794.0" height="1207.0" fill="white" /><ns0:text x="36" y="28" fill="#203849" font-size="16" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="36" dy="0">08a  Evaluate one candidate</ns0:tspan></ns0:text><ns0:text x="36" y="48" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="36" dy="0">evaluate_solution() derives components and coordinates, rejects non-finite coordinates, calculates polygon area, and</ns0:tspan><ns0:tspan x="36" dy="13">returns a Solution. It does not decide candidate acceptance.</ns0:tspan></ns0:text><ns0:polyline points="342.5,147.05999999999995 342.5,168.89999999999998 342.5,175.89999999999998" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="342.5,175.89999999999998 345.5,168.89999999999998 339.5,168.89999999999998" fill="#465b68" /><ns0:polyline points="342.5,254.24 342.5,275.97 342.5,282.97" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="342.5,282.97 345.5,275.97 339.5,275.97" fill="#465b68" /><ns0:polyline points="342.5,347.19000000000005 342.5,368.87 342.5,375.87" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="342.5,375.87 345.5,368.87 339.5,368.87" fill="#465b68" /><ns0:polyline points="342.5,454.16999999999996 342.5,475.91999999999996 342.5,482.91999999999996" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="342.5,482.91999999999996 345.5,475.91999999999996 339.5,475.91999999999996" fill="#465b68" /><ns0:polyline points="342.5,533.12 342.5,554.95 342.5,561.95" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="342.5,561.95 345.5,554.95 339.5,554.95" fill="#465b68" /><ns0:polyline points="263.25,642.0699999999999 263.25,690.63 263.25,697.63" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="263.25,697.63 266.25,690.63 260.25,690.63" fill="#465b68" /><ns0:polyline points="448.75,633.74 448.75,690.64 448.75,697.64" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="448.75,697.64 451.75,690.64 445.75,690.64" fill="#465b68" /><ns0:polyline points="490.5,748.1800000000001 490.5,772.94 490.5,779.94" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="490.5,779.94 493.5,772.94 487.5,772.94" fill="#465b68" /><ns0:polyline points="414.0,810.96 414.0,860.88 414.0,867.88" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="414.0,867.88 417.0,860.88 411.0,860.88" fill="#465b68" /><ns0:polyline points="535.0,818.04 535.0,849.9300000000001 535.0,856.9300000000001" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="535.0,856.9300000000001 538.0,849.9300000000001 532.0,849.9300000000001" fill="#465b68" /><ns0:polyline points="426.25,910.12 426.25,942.95 426.25,949.95" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="426.25,949.95 429.25,942.95 423.25,942.95" fill="#465b68" /><ns0:polyline points="522.75,921.41 522.75,942.65 522.75,949.65" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="522.75,949.65 525.75,942.65 519.75,942.65" fill="#465b68" /><ns0:polyline points="490.5,992.03 490.5,1013.9300000000001 490.5,1020.9300000000001" fill="none" stroke="#465b68" stroke-width="1.2" /><ns0:polygon points="490.5,1020.9300000000001 493.5,1013.9300000000001 487.5,1013.9300000000001" fill="#465b68" /><ns0:ellipse cx="342.5" cy="123.5" rx="151.6320166015625" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:ellipse><ns0:text x="342.5" y="127.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="342.5" dy="0">evaluate_solution(sides, initial_e, initial_n)</ns0:tspan></ns0:text><ns0:rect x="206.145751953125" y="176.0" width="272.70849609375" height="78" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>vector — traverse_solver.py:178–180</ns0:title></ns0:rect><ns0:line x1="214.145751953125" y1="176.0" x2="214.145751953125" y2="254.0" stroke="#33548b" /><ns0:line x1="470.854248046875" y1="176.0" x2="470.854248046875" y2="254.0" stroke="#33548b" /><ns0:text x="342.5" y="197.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="342.5" dy="0">components = [vector(side) for side in sides]</ns0:tspan><ns0:tspan x="342.5" dy="14">vector(side): east, north =</ns0:tspan><ns0:tspan x="342.5" dy="14">unit_vector(side.azimuth)</ns0:tspan><ns0:tspan x="342.5" dy="14">return side.length * east, side.length * north</ns0:tspan></ns0:text><ns0:rect x="203.64013671875" y="283.0" width="277.7197265625" height="64" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:rect><ns0:text x="342.5" y="304.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="342.5" dy="0">perimeter = math.fsum(side.length for side in</ns0:tspan><ns0:tspan x="342.5" dy="14">sides)</ns0:tspan><ns0:tspan x="342.5" dy="14">policy = NumericalPolicy(perimeter)</ns0:tspan></ns0:text><ns0:rect x="211.11669921875" y="376.0" width="262.7666015625" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:rect><ns0:text x="342.5" y="397.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="342.5" dy="0">local = [(0.0, 0.0)] + [</ns0:tspan><ns0:tspan x="342.5" dy="14">    (math.fsum(e for e, _ in components[:i]),</ns0:tspan><ns0:tspan x="342.5" dy="14">     math.fsum(n for _, n in components[:i]))</ns0:tspan><ns0:tspan x="342.5" dy="14">    for i in range(1, len(sides) + 1)]</ns0:tspan></ns0:text><ns0:rect x="214.465576171875" y="483.0" width="256.06884765625" height="50" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:rect><ns0:text x="342.5" y="504.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="342.5" dy="0">coordinates = [(initial_e + e, initial_n + n)</ns0:tspan><ns0:tspan x="342.5" dy="14">for e, n in local]</ns0:tspan></ns0:text><ns0:polygon points="342.5,562.0 513.396484375,614.0 342.5,666.0 171.603515625,614.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:polygon><ns0:text x="342.5" y="603.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="342.5" dy="0">any(not math.isfinite(value)</ns0:tspan><ns0:tspan x="342.5" dy="14">    for point in coordinates for</ns0:tspan><ns0:tspan x="342.5" dy="14">value in point)?</ns0:tspan></ns0:text><ns0:ellipse cx="195.5" cy="723.0" rx="159.481494140625" ry="28.000000000000004" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:ellipse><ns0:text x="195.5" y="719.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="195.5" dy="0">raise TraverseError("Coordinates exceed the</ns0:tspan><ns0:tspan x="195.5" dy="14">supported floating-point range.")</ns0:tspan></ns0:text><ns0:rect x="384.09765625" y="698.0" width="212.8046875" height="50" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>polygon_area — traverse_solver.py:188–221</ns0:title></ns0:rect><ns0:line x1="392.09765625" y1="698.0" x2="392.09765625" y2="748.0" stroke="#33548b" /><ns0:line x1="588.90234375" y1="698.0" x2="588.90234375" y2="748.0" stroke="#33548b" /><ns0:text x="490.5" y="719.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="490.5" dy="0">area = polygon_area(local, policy)</ns0:tspan><ns0:tspan x="490.5" dy="14">See page 08b.</ns0:tspan></ns0:text><ns0:polygon points="490.5,780.0 597.09912109375,804.0 490.5,828.0 383.90087890625,804.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:polygon><ns0:text x="490.5" y="807.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="490.5" dy="0">area is not None?</ns0:tspan></ns0:text><ns0:rect x="289.0" y="868.0" width="155" height="42" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:rect><ns0:text x="366.5" y="892.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="366.5" dy="0">warnings = []</ns0:tspan></ns0:text><ns0:rect x="472.939453125" y="857.0" width="285.12109375" height="64" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:rect><ns0:text x="615.5" y="878.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="615.5" dy="0">warnings = ["Crossed or degenerate boundary:</ns0:tspan><ns0:tspan x="615.5" dy="14">sides intersect, touch, or retrace; area</ns0:tspan><ns0:tspan x="615.5" dy="14">unavailable."]</ns0:tspan></ns0:text><ns0:rect x="408.52001953125" y="950.0" width="163.9599609375" height="42" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:rect><ns0:text x="490.5" y="974.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="490.5" dy="0">sum_e, sum_n = local[-1]</ns0:tspan></ns0:text><ns0:ellipse cx="490.5" cy="1072.5" rx="172.38227050781248" ry="51.52" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>evaluate_solution — traverse_solver.py:306–321</ns0:title></ns0:ellipse><ns0:text x="490.5" y="1048.35" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="490.5" dy="0">return Solution(sides, components, local,</ns0:tspan><ns0:tspan x="490.5" dy="14">coordinates,</ns0:tspan><ns0:tspan x="490.5" dy="14">    perimeter, sum_e, sum_n, math.hypot(sum_e,</ns0:tspan><ns0:tspan x="490.5" dy="14">sum_n),</ns0:tspan><ns0:tspan x="490.5" dy="14">    area, warnings, policy.length)</ns0:tspan></ns0:text><ns0:rect x="244.88818359375" y="664.35" width="21.7236328125" height="14" fill="white" /><ns0:text x="255.75" y="674.35" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="255.75" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="433.130615234375" y="660.19" width="18.23876953125" height="14" fill="white" /><ns0:text x="442.25" y="670.19" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="442.25" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="395.63818359375" y="833.9200000000001" width="21.7236328125" height="14" fill="white" /><ns0:text x="406.5" y="843.9200000000001" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="406.5" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="519.380615234375" y="831.98" width="18.23876953125" height="14" fill="white" /><ns0:text x="528.5" y="841.98" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="528.5" dy="0">No</ns0:tspan></ns0:text><ns0:text x="36" y="1188.0" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="36" dy="0">traverse_solver.py · 0cf64fb · source SHA-256 e18d3a23955f4292…</ns0:tspan></ns0:text><ns0:text x="758.0" y="1188.0" fill="#203849" font-size="9" font-family="DejaVu Sans, san