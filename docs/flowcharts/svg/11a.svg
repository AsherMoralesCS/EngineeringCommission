x="153.70133789062498" ry="23.520000000000003" fill="#e8f0f5" stroke="#294759" stroke-width="1.3"><ns0:title>export_report — traverse_solver.py:530–569</ns0:title></ns0:ellipse><ns0:text x="477.0" y="851.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="477.0" dy="0">Exit with block (close stream); return None</ns0:tspan></ns0:text><ns0:rect x="36" y="1050.0" width="628" height="59" fill="#f6f7f9" stroke="#75828c" stroke-width="1.1" rx="0"><ns0:title>export_report.section — traverse_solver.py:535–551</ns0:title></ns0:rect><ns0:text x="48" y="1067.0" fill="#203849" font-size="10" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="48" dy="0">No local exception handler in export_report() or section().</ns0:tspan><ns0:tspan x="48" dy="13">File / encoding / CSV / formatting errors propagate;</ns0:tspan><ns0:tspan x="48" dy="13">the with block closes an already-open stream on exit.</ns0:tspan></ns0:text><ns0:rect x="297.46818359375" y="664.1" width="21.7236328125" height="14" fill="white" /><ns0:text x="308.33" y="674.1" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="308.33" dy="0">Yes</ns0:tspan></ns0:text><ns0:rect x="461.380615234375" y="671.98" width="18.23876953125" height="14" fill="white" /><ns0:text x="470.5" y="681.98" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="470.5" dy="0">No</ns0:tspan></ns0:text><ns0:rect x="256.85749999999996" y="778.27" width="65.625" height="14" fill="white" /><ns0:text x="289.66999999999996" y="788.27" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="289.66999999999996" dy="0">Next solution</ns0:tspan></ns0:text><ns0:text x="36" y="1148.0" fill="#203849" font-size="9" font-family="DejaVu Sans, sans-serif" text-anchor="start"><ns0:tspan x="36" dy="0">traverse_solver.py · 0cf64fb · source SHA-256 e18