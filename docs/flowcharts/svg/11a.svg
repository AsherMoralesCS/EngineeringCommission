aring"), ...)</ns0:tspan><ns0:tspan x="477.0" dy="14">Each input uses "Unknown" when its</ns0:tspan><ns0:tspan x="477.0" dy="14">corresponding</ns0:tspan><ns0:tspan x="477.0" dy="14">unknown flag is set.</ns0:tspan></ns0:text><ns0:polygon points="477.0,590.0 646.10791015625,628.0 477.0,666.0 307.89208984375,628.0" fill="#fff5d9" stroke="#806728" stroke-width="1.3"><ns0:title>export_report — traverse_solver.py:530–569</ns0:title></ns0:polygon><ns0:text x="477.0" y="624.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="477.0" dy="0">Next index, solution in</ns0:tspan><ns0:tspan x="477.0" dy="14">enumerate(result.solutions)?</ns0:tspan></ns0:text><ns0:rect x="47.9130859375" y="695.0" width="264.173828125" height="78" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>solution_summary — traverse_solver.py:509–527</ns0:title></ns0:rect><ns0:line x1="55.9130859375" y1="695.0" x2="55.9130859375" y2="773.0" stroke="#33548b" /><ns0:line x1="304.0869140625" y1="695.0" x2="304.0869140625" y2="773.0" stroke="#33548b" /><ns0:text x="180.0" y="716.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="180.0" dy="0">section(f"SOLUTION {index + 1}", (), ...)</ns0:tspan><ns0:tspan x="180.0" dy="14">rows from solution_summary(model, result,</ns0:tspan><ns0:tspan x="180.0" dy="14">index).splitlines()</ns0:tspan><ns0:tspan x="180.0" dy="14">See page 11b.</ns0:tspan></ns0:text><ns0:rect x="35.95849609375" y="802.0" width="258.0830078125" height="92" fill="#edf2fa" stroke="#33548b" stroke-width="1.1" rx="0"><ns0:title>calculation_rows — traverse_solver.py:496–502</ns0:title></ns0:rect><ns0:line x1="43.95849609375" y1="802.0" x2="43.95849609375" y2="894.0" stroke="#33548b" /><ns0:line x1="286.04150390625" y1="802.0" x2="286.04150390625" y2="894.0" stroke="#33548b" /><ns0:text x="165.0" y="823.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" 