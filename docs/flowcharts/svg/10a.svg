e="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="227.0" dy="0">More (i, (a, b)) in enumerate(zip(</ns0:tspan><ns0:tspan x="227.0" dy="14">    solution.local_coordinates,</ns0:tspan><ns0:tspan x="227.0" dy="14">solution.local_coordinates[1:]))?</ns0:tspan></ns0:text><ns0:rect x="42.33056640625" y="635.0" width="271.3388671875" height="92" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>PlotView.render — traverse_solver.py:614–640</ns0:title></ns0:rect><ns0:text x="178.0" y="656.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="178.0" dy="0">row = model.rows[i]</ns0:tspan><ns0:tspan x="178.0" dy="14">color = "#e11d48" if row.length_unknown or</ns0:tspan><ns0:tspan x="178.0" dy="14">row.bearing_unknown else "#2563eb"</ns0:tspan><ns0:tspan x="178.0" dy="14">axes.plot(...); axes.annotate(...): arrow a to</ns0:tspan><ns0:tspan x="178.0" dy="14">b and f"P{i + 1}"</ns0:tspan></ns0:text><ns0:polygon points="383.011416015625,635.0 644.669189453125,635.0 608.988583984375,727.0 347.330810546875,727.0" fill="#ebf5ef" stroke="#315f4b" stroke-width="1.3"><ns0:title>PlotView.render — traverse_solver.py:614–640</ns0:title></ns0:polygon><ns0:text x="496.0" y="656.85" fill="#203849" font-size="11" font-family="DejaVu Sans, sans-serif" text-anchor="middle"><ns0:tspan x="496.0" dy="0">Mark local origin orange; set local axes</ns0:tspan><ns0:tspan x="496.0" dy="14">labels and unit,</ns0:tspan><ns0:tspan x="496.0" dy="14">solution number and geometry_label title.</ns0:tspan><ns0:tspan x="496.0" dy="14">self.message: known/solved colors and model</ns0:tspan><ns0:tspan x="496.0" dy="14">origin.</ns0:tspan></ns0:text><ns0:rect x="496.291259765625" y="515.0" width="273.41748046875" height="78" fill="#ffffff" stroke="#466171" stroke-width="1.1" rx="0"><ns0:title>PlotView.render — traverse_solver.py:614–640</ns0:title></ns0:rect><ns0:text x="633.0" y="536.85" fill="#203849" font-size="11